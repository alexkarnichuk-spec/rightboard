<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Раздел в разработке — RightBoard</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#f5f1e8">
    <link rel="icon" href="/rightboard/assets/favicon-32.png" sizes="32x32">
    <link rel="stylesheet" href="/rightboard/assets/css/main.css">
    <style>
      .soon {
        min-height: 100svh;
        display: grid;
        align-content: center;
        padding-block: clamp(40px, 8vw, 96px);
      }
      .soon__num {
        font-size: clamp(4.5rem, 18vw, 12rem);
        font-weight: 700;
        line-height: 0.85;
        letter-spacing: -0.05em;
        color: var(--sand);
        margin-bottom: clamp(-8px, -1.5vw, -22px);
      }
      .soon h1 {
        font-size: var(--fs-h2);
        max-width: 26ch;
      }
      .soon p {
        margin-top: 16px;
        color: var(--muted);
        max-width: 46ch;
      }
      .soon .btn-row {
        margin-top: clamp(24px, 3vw, 36px);
      }
    </style>
  </head>
  <body>
    <main class="soon">
      <div class="wrap">
        <p class="sec-index"><b>—</b> Раздел в разработке</p>
        <div class="soon__num" aria-hidden="true">404</div>
        <h1>Эта страница появится на следующем этапе</h1>
        <p>
          Здесь будет отдельная страница раздела. Сейчас на сайте готов
          и опубликован один раздел — главная с полным рассказом о материале,
          сравнением, проверкой и объектами.
        </p>
        <div class="btn-row">
          <a class="btn" href="/rightboard/">На главную</a>
          <a class="btn btn--ghost" href="tel:+79033624242">+7 903 362 4242</a>
        </div>
      </div>
    </main>
  </body>
</html>
